name: Publish Mac Release
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: hardplay-public-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'RavitzLab/HARDPLAY' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release]'))
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit public source
        run: python3 scripts/audit-source.py
      - name: Check web edition
        working-directory: web
        run: |
          node scripts/build.mjs
          node --test tests/*.test.mjs
          node scripts/validate-artifact.mjs
      - name: Build Mac installers and run required checks
        run: |
          test "$(uname -m)" = arm64
          zsh scripts/release.sh
      - name: Check playlists, import and backup synchronization
        run: |
          build/HARDPLAY.app/Contents/MacOS/HARDPLAY --playlist-test
          build/HARDPLAY.app/Contents/MacOS/HARDPLAY --media-import-test
          build/HARDPLAY.app/Contents/MacOS/HARDPLAY --backup-test
          build/HARDPLAY.app/Contents/MacOS/HARDPLAY --backup-link-test
          build/HARDPLAY.app/Contents/MacOS/HARDPLAY --set-sync-test
          build/HARDPLAY.app/Contents/MacOS/HARDPLAY --linked-playback-test
      - name: Publish checked installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/HARDPLAY.app/Contents/Info.plist)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          notes="docs/RELEASE-$version.md"
          test -f "$notes"
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists; existing assets will not be replaced."
            exit 1
          fi
          (cd build/release && shasum -a 256 -c "HARDPLAY-$version-macOS-arm64.sha256")
          gh release create "$tag" build/release/HARDPLAY-$version-macOS-arm64.{dmg,zip,sha256} --target "$GITHUB_SHA" --title "Hard Play $version" --notes-file "$notes" --draft
          gh release edit "$tag" --draft=false --latest
